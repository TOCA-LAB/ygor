[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ygor"
version = "0.2.0"
description = "YAML-Guided Orchestrator for Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "rarfile>=4.0",
]

[project.scripts]
ygor = "ygor.cli:app"

[project.optional-dependencies]
dev = [
    "hatch>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ygor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
